<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — DineFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-egg-fried me-2"></i>DineFlow</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        <div id="authButtons" class="ms-3">
          <a href="login.html" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="register.html" class="btn btn-accent btn-sm">Sign Up</a>
        </div>
        <div id="userMenu" class="ms-3 d-none"></div>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="feature-icon mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem">
          <i class="bi bi-person-plus"></i>
        </div>
        <h3 class="fw-bold">Create Account</h3>
        <p class="text-muted small">Join DineFlow to start reserving and ordering</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="John Doe" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="mb-4">
          <label for="role" class="form-label">Register As</label>
          <select class="form-select" id="role">
            <option value="customer">Customer</option>
            <option value="kitchen">Kitchen Staff</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="btn btn-accent w-100 py-2" id="registerBtn">
          <i class="bi bi-person-plus me-2"></i>Create Account
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="text-muted small mb-0">Already have an account? <a href="login.html" class="text-accent text-decoration-none fw-600">Sign In</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = '/';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating...';

      try {
        const result = await api.register({
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          role: document.getElementById('role').value
        });

        localStorage.setItem('token', result.data.token);
        localStorage.setItem('user', JSON.stringify(result.data.user));
        showToast('Account created successfully!', 'success');

        setTimeout(() => {
          const role = result.data.user.role;
          if (role === 'kitchen') window.location.href = 'kitchen.html';
          else if (role === 'admin' || role === 'manager') window.location.href = 'dashboard.html';
          else window.location.href = 'menu.html';
        }, 500);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
      }
    });
  </script>
</body>
</html>

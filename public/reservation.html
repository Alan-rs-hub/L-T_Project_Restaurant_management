<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserve a table at DineFlow restaurants">
  <title>Table Reservations — DineFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .table-selection-card {
      background: var(--bg-card);
      border: 2px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .table-selection-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    .table-selection-card.selected {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-egg-fried me-2"></i>DineFlow
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        <div id="authButtons" class="ms-3">
          <a href="login.html" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="register.html" class="btn btn-accent btn-sm">Sign Up</a>
        </div>
        <div id="userMenu" class="ms-3 d-none">
          <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" id="userDropdown">
              <i class="bi bi-person-circle me-1"></i><span id="userName">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
              <li><span class="dropdown-item-text text-muted small" id="userRole">Role</span></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h1 class="h2 fw-bold mb-1">Table Reservations</h1>
          <p class="text-muted mb-0">Book your table in advance with instant real-time confirmation</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <section class="py-5">
    <div class="container">
      <div class="row g-4">
        <!-- Booking Form Column -->
        <div class="col-lg-5">
          <div class="data-card">
            <h4 class="fw-bold mb-3"><i class="bi bi-calendar-plus me-2 text-accent"></i>Book a Table</h4>
            
            <form id="reservationForm" onsubmit="searchTables(event)">
              <div class="mb-3">
                <label class="form-label">Branch *</label>
                <select class="form-select" id="resBranchId" required onchange="resetAvailableTables()">
                  <option value="">Loading branches...</option>
                </select>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label class="form-label">Date & Time *</label>
                  <input type="datetime-local" class="form-control" id="resDateTime" required onchange="resetAvailableTables()">
                </div>
                <div class="col-6">
                  <label class="form-label">Party Size *</label>
                  <input type="number" min="1" max="20" class="form-control" id="resPartySize" value="2" required onchange="resetAvailableTables()">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Duration</label>
                <select class="form-select" id="resDuration" onchange="resetAvailableTables()">
                  <option value="60">1 Hour (60 mins)</option>
                  <option value="90">1.5 Hours (90 mins)</option>
                  <option value="120" selected>2 Hours (120 mins)</option>
                  <option value="180">3 Hours (180 mins)</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Special Requests (Optional)</label>
                <textarea class="form-control" id="resSpecialRequests" rows="2" placeholder="Window seat, anniversary, birthday cake, etc."></textarea>
              </div>

              <button type="submit" class="btn btn-outline-accent w-100 mb-3" id="checkAvailabilityBtn">
                <i class="bi bi-search me-2"></i>Check Table Availability
              </button>
            </form>

            <!-- Available Tables Container -->
            <div id="availableTablesSection" class="d-none mt-4 pt-3 border-top" style="border-color:var(--glass-border) !important">
              <h6 class="fw-bold text-white mb-2"><i class="bi bi-grid-3x3-gap me-2 text-accent"></i>Select Available Table</h6>
              <div class="row g-2" id="availableTablesGrid"></div>
              
              <button class="btn btn-accent w-100 mt-3 py-2" id="confirmBookingBtn" disabled onclick="confirmReservation()">
                <i class="bi bi-check2-circle me-2"></i>Confirm Reservation
              </button>
            </div>
          </div>
        </div>

        <!-- Reservations List Column -->
        <div class="col-lg-7">
          <div class="data-card h-100">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
              <h4 class="fw-bold mb-0" id="resListTitle"><i class="bi bi-journal-bookmark me-2 text-accent"></i>My Reservations</h4>
              <button class="btn btn-sm btn-outline-light" onclick="loadReservations()">
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh
              </button>
            </div>

            <div id="reservationsList">
              <div class="text-center py-5">
                <div class="spinner-border text-accent" role="status"></div>
                <p class="text-muted mt-2">Loading reservations...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Reschedule Modal -->
  <div class="modal fade" id="rescheduleModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Reschedule Reservation</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="rescheduleForm" onsubmit="submitReschedule(event)">
          <div class="modal-body">
            <input type="hidden" id="rescheduleId">
            <div class="mb-3">
              <label class="form-label">New Date & Time *</label>
              <input type="datetime-local" class="form-control" id="rescheduleDateTime" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Party Size</label>
              <input type="number" min="1" max="20" class="form-control" id="reschedulePartySize">
            </div>
            <div class="mb-3">
              <label class="form-label">Duration</label>
              <select class="form-select" id="rescheduleDuration">
                <option value="60">1 Hour (60 mins)</option>
                <option value="90">1.5 Hours (90 mins)</option>
                <option value="120">2 Hours (120 mins)</option>
                <option value="180">3 Hours (180 mins)</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-accent btn-sm" id="rescheduleSubmitBtn">Update Booking</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let branches = [];
    let selectedTableId = null;
    let rescheduleModal = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // Set min datetime for picker to current local time
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('resDateTime').min = now.toISOString().slice(0, 16);
      
      // Default datetime to 2 hours from now
      const defaultTime = new Date(Date.now() + 2 * 3600 * 1000);
      defaultTime.setMinutes(defaultTime.getMinutes() - defaultTime.getTimezoneOffset());
      document.getElementById('resDateTime').value = defaultTime.toISOString().slice(0, 16);

      rescheduleModal = new bootstrap.Modal(document.getElementById('rescheduleModal'));
      
      await loadBranches();
      await loadReservations();
    });

    async function loadBranches() {
      try {
        const res = await api.getBranches('?limit=50&active=true');
        branches = res.data.branches;
        const select = document.getElementById('resBranchId');
        select.innerHTML = '<option value="">-- Choose Branch --</option>';
        branches.forEach(b => {
          select.innerHTML += `<option value="${b._id}">${b.name} (${b.address})</option>`;
        });
        if (branches.length > 0) {
          select.value = branches[0]._id;
        }
      } catch (err) {
        showToast('Failed to load branches', 'error');
      }
    }

    function resetAvailableTables() {
      selectedTableId = null;
      document.getElementById('availableTablesSection').classList.add('d-none');
      document.getElementById('confirmBookingBtn').disabled = true;
    }

    async function searchTables(e) {
      e.preventDefault();
      const branchId = document.getElementById('resBranchId').value;
      const dateTime = document.getElementById('resDateTime').value;
      const partySize = document.getElementById('resPartySize').value;
      const duration = document.getElementById('resDuration').value;

      if (!branchId || !dateTime) {
        showToast('Please select branch, date, and time', 'warning');
        return;
      }

      const btn = document.getElementById('checkAvailabilityBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Checking...';

      try {
        const res = await api.getAvailableTables(`?branchId=${branchId}&dateTime=${encodeURIComponent(dateTime)}&partySize=${partySize}&duration=${duration}`);
        const tables = res.data.tables;

        const section = document.getElementById('availableTablesSection');
        const grid = document.getElementById('availableTablesGrid');
        section.classList.remove('d-none');

        if (tables.length === 0) {
          grid.innerHTML = `
            <div class="col-12 text-center py-3 text-warning">
              <i class="bi bi-exclamation-circle fs-3 mb-2"></i>
              <p class="small mb-0">No tables available for party size of ${partySize} at this time. Try another time slot or party size.</p>
            </div>
          `;
          document.getElementById('confirmBookingBtn').disabled = true;
          return;
        }

        selectedTableId = null;
        document.getElementById('confirmBookingBtn').disabled = true;

        grid.innerHTML = tables.map(t => `
          <div class="col-4">
            <div class="table-selection-card" id="tableCard-${t._id}" onclick="selectTable('${t._id}')">
              <i class="bi bi-tablet-landscape fs-3 text-accent mb-1 d-block"></i>
              <div class="fw-bold">Table ${t.tableNumber}</div>
              <div class="text-muted small">Seats ${t.capacity}</div>
            </div>
          </div>
        `).join('');

        // Auto select first table
        selectTable(tables[0]._id);

      } catch (err) {
        showToast(err.message || 'Error checking availability', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-search me-2"></i>Check Table Availability';
      }
    }

    function selectTable(id) {
      selectedTableId = id;
      document.querySelectorAll('.table-selection-card').forEach(el => el.classList.remove('selected'));
      const el = document.getElementById(`tableCard-${id}`);
      if (el) el.classList.add('selected');
      document.getElementById('confirmBookingBtn').disabled = false;
    }

    async function confirmReservation() {
      if (!isLoggedIn()) {
        showToast('Please login to make a reservation', 'warning');
        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        return;
      }

      if (!selectedTableId) {
        showToast('Please select a table', 'warning');
        return;
      }

      const branchId = document.getElementById('resBranchId').value;
      const dateTime = document.getElementById('resDateTime').value;
      const partySize = parseInt(document.getElementById('resPartySize').value);
      const duration = parseInt(document.getElementById('resDuration').value);
      const specialRequests = document.getElementById('resSpecialRequests').value.trim();

      const btn = document.getElementById('confirmBookingBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Booking...';

      try {
        await api.createReservation({
          branchId,
          tableId: selectedTableId,
          dateTime,
          partySize,
          duration,
          specialRequests
        });

        showToast('Reservation confirmed successfully!', 'success');
        resetAvailableTables();
        document.getElementById('resSpecialRequests').value = '';
        await loadReservations();
      } catch (err) {
        showToast(err.message || 'Failed to book reservation', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check2-circle me-2"></i>Confirm Reservation';
      }
    }

    async function loadReservations() {
      const container = document.getElementById('reservationsList');
      const title = document.getElementById('resListTitle');

      if (!isLoggedIn()) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="bi bi-lock"></i>
            <h6>Please Log In</h6>
            <p class="text-muted small">Sign in to view and manage your reservations.</p>
            <a href="login.html" class="btn btn-accent btn-sm">Login Now</a>
          </div>
        `;
        return;
      }

      const role = getUserRole();
      if (role === 'admin' || role === 'manager') {
        title.innerHTML = '<i class="bi bi-journal-bookmark me-2 text-accent"></i>All Reservations';
      }

      try {
        const res = await api.getReservations('?limit=50');
        const reservations = res.data.reservations;

        if (reservations.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="bi bi-calendar-x"></i>
              <h6>No Reservations Found</h6>
              <p class="text-muted small">You don't have any bookings yet. Use the form to book a table!</p>
            </div>
          `;
          return;
        }

        container.innerHTML = reservations.map(r => {
          const isConfirmed = r.status === 'confirmed';
          const canCancel = isConfirmed;

          return `
            <div class="glass-card-inner p-3 mb-3">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h6 class="fw-bold mb-1 text-white">${r.branchId?.name || 'Branch'} — Table ${r.tableId?.tableNumber || 'N/A'}</h6>
                  <div class="text-muted small">
                    <i class="bi bi-calendar-event me-1 text-accent"></i>${formatDateTime(r.dateTime)} 
                    <span class="ms-2"><i class="bi bi-clock me-1"></i>${r.duration} mins</span>
                    <span class="ms-2"><i class="bi bi-people me-1"></i>${r.partySize} guests</span>
                  </div>
                </div>
                <div>${statusBadge(r.status)}</div>
              </div>

              ${r.specialRequests ? `
                <div class="small text-muted bg-dark-subtle p-2 rounded mb-2" style="border: 1px solid var(--glass-border)">
                  <i class="bi bi-chat-left-quote me-1 text-accent"></i>"${escapeHtml(r.specialRequests)}"
                </div>
              ` : ''}

              ${(role === 'admin' || role === 'manager') ? `
                <div class="text-muted small mb-2"><i class="bi bi-person me-1"></i>Customer: ${escapeHtml(r.customerId?.name || 'Customer')} (${r.customerId?.email || ''})</div>
              ` : ''}

              ${canCancel ? `
                <div class="d-flex gap-2 justify-content-end pt-2 border-top" style="border-color:var(--glass-border) !important">
                  <button class="btn btn-outline-light btn-sm" onclick="openRescheduleModal('${r._id}', '${r.dateTime}', ${r.partySize}, ${r.duration})">
                    <i class="bi bi-clock-history me-1"></i>Reschedule
                  </button>
                  <button class="btn btn-outline-danger btn-sm" onclick="cancelReservation('${r._id}')">
                    <i class="bi bi-x-circle me-1"></i>Cancel
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

      } catch (err) {
        container.innerHTML = `
          <div class="text-center py-4 text-danger">
            <i class="bi bi-exclamation-triangle fs-3 mb-2"></i>
            <p>Failed to load reservations: ${err.message || 'Server error'}</p>
          </div>
        `;
      }
    }

    async function cancelReservation(id) {
      if (!confirm('Are you sure you want to cancel this reservation? Note: Cancellations within 1 hour of the reservation time are not allowed for customers.')) return;

      try {
        await api.cancelReservation(id);
        showToast('Reservation cancelled', 'success');
        loadReservations();
      } catch (err) {
        showToast(err.message || 'Failed to cancel reservation', 'error');
      }
    }

    function openRescheduleModal(id, currentDateTime, partySize, duration) {
      document.getElementById('rescheduleId').value = id;
      const dt = new Date(currentDateTime);
      dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
      document.getElementById('rescheduleDateTime').value = dt.toISOString().slice(0, 16);
      document.getElementById('reschedulePartySize').value = partySize;
      document.getElementById('rescheduleDuration').value = duration;
      rescheduleModal.show();
    }

    async function submitReschedule(e) {
      e.preventDefault();
      const id = document.getElementById('rescheduleId').value;
      const dateTime = document.getElementById('rescheduleDateTime').value;
      const partySize = parseInt(document.getElementById('reschedulePartySize').value);
      const duration = parseInt(document.getElementById('rescheduleDuration').value);

      const btn = document.getElementById('rescheduleSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';

      try {
        await api.updateReservation(id, { dateTime, partySize, duration });
        showToast('Reservation rescheduled successfully!', 'success');
        rescheduleModal.hide();
        loadReservations();
      } catch (err) {
        showToast(err.message || 'Failed to reschedule', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Update Booking';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DineFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-egg-fried me-2"></i>DineFlow</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        <div id="authButtons" class="ms-3">
          <a href="login.html" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="register.html" class="btn btn-accent btn-sm">Sign Up</a>
        </div>
        <div id="userMenu" class="ms-3 d-none">
          <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" id="userDropdown">
              <i class="bi bi-person-circle me-1"></i><span id="userName">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
              <li><span class="dropdown-item-text text-muted small" id="userRole">Role</span></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="feature-icon mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem">
          <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <h3 class="fw-bold">Welcome Back</h3>
        <p class="text-muted small">Sign in to your DineFlow account</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--bg-card);border-color:var(--glass-border);color:var(--text-secondary)">
              <i class="bi bi-envelope"></i>
            </span>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text" style="background:var(--bg-card);border-color:var(--glass-border);color:var(--text-secondary)">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-accent w-100 py-2" id="loginBtn">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="text-muted small mb-0">Don't have an account? <a href="register.html" class="text-accent text-decoration-none fw-600">Sign Up</a></p>
      </div>

      <hr class="my-4" style="border-color:var(--glass-border)">
      <div class="text-center">
        <p class="text-muted small mb-2">Demo Accounts</p>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
          <button class="btn btn-outline-accent btn-sm" onclick="fillDemo('admin@dineflow.com','admin123')">Admin</button>
          <button class="btn btn-outline-accent btn-sm" onclick="fillDemo('manager@dineflow.com','manager123')">Manager</button>
          <button class="btn btn-outline-accent btn-sm" onclick="fillDemo('kitchen@dineflow.com','kitchen123')">Kitchen</button>
          <button class="btn btn-outline-accent btn-sm" onclick="fillDemo('customer@dineflow.com','customer123')">Customer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) {
      const role = getUserRole();
      if (role === 'kitchen') window.location.href = 'kitchen.html';
      else if (role === 'admin' || role === 'manager') window.location.href = 'dashboard.html';
      else window.location.href = 'menu.html';
    }

    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      try {
        const result = await api.login({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        localStorage.setItem('token', result.data.token);
        localStorage.setItem('user', JSON.stringify(result.data.user));
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          const role = result.data.user.role;
          if (role === 'kitchen') window.location.href = 'kitchen.html';
          else if (role === 'admin' || role === 'manager') window.location.href = 'dashboard.html';
          else window.location.href = 'menu.html';
        }, 500);
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
      }
    });
  </script>
</body>
</html>

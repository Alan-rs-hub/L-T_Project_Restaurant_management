<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View orders, billing details, and submit dining feedback">
  <title>Orders & Billing — DineFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .star-rating i {
      font-size: 1.75rem;
      color: var(--glass-border);
      cursor: pointer;
      transition: var(--transition);
    }
    .star-rating i.active, .star-rating i:hover {
      color: #f1c40f;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-egg-fried me-2"></i>DineFlow
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        <div id="authButtons" class="ms-3">
          <a href="login.html" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="register.html" class="btn btn-accent btn-sm">Sign Up</a>
        </div>
        <div id="userMenu" class="ms-3 d-none">
          <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" id="userDropdown">
              <i class="bi bi-person-circle me-1"></i><span id="userName">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
              <li><span class="dropdown-item-text text-muted small" id="userRole">Role</span></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h1 class="h2 fw-bold mb-1">Orders & Billing</h1>
          <p class="text-muted mb-0">Track live order status, verify itemized billing, and share your experience</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
          <button class="btn btn-outline-light btn-sm" onclick="loadOrders()">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh Orders
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Filter Section -->
  <section class="py-4">
    <div class="container">
      <div class="row g-3 align-items-center">
        <div class="col-md-4" id="branchFilterCol" style="display:none">
          <label class="form-label small mb-1">Branch</label>
          <select class="form-select form-select-sm" id="branchFilter" onchange="loadOrders()">
            <option value="">All Branches</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small mb-1">Status Filter</label>
          <select class="form-select form-select-sm" id="statusFilter" onchange="loadOrders()">
            <option value="">All Statuses</option>
            <option value="placed">Placed</option>
            <option value="preparing">Preparing</option>
            <option value="ready">Ready</option>
            <option value="served">Served</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small mb-1">Order Type</label>
          <select class="form-select form-select-sm" id="typeFilter" onchange="loadOrders()">
            <option value="">All Types</option>
            <option value="dine_in">Dine-in</option>
            <option value="takeaway">Takeaway</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- Orders List Container -->
  <section class="pb-5">
    <div class="container">
      <div class="row g-4" id="ordersGrid">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-accent" role="status"></div>
          <p class="text-muted mt-2">Loading orders...</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Feedback Modal -->
  <div class="modal fade" id="feedbackModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold"><i class="bi bi-star me-2 text-warning"></i>Dining Experience Feedback</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="feedbackForm" onsubmit="submitFeedback(event)">
          <div class="modal-body">
            <input type="hidden" id="feedbackOrderId">
            <div class="text-center mb-4">
              <p class="text-muted mb-2">How was your dining experience?</p>
              <div class="star-rating d-flex justify-content-center gap-2" id="starContainer">
                <i class="bi bi-star" data-rating="1" onclick="setRating(1)"></i>
                <i class="bi bi-star" data-rating="2" onclick="setRating(2)"></i>
                <i class="bi bi-star" data-rating="3" onclick="setRating(3)"></i>
                <i class="bi bi-star" data-rating="4" onclick="setRating(4)"></i>
                <i class="bi bi-star" data-rating="5" onclick="setRating(5)"></i>
              </div>
              <input type="hidden" id="feedbackRating" value="5">
              <div class="small text-accent mt-2 fw-600" id="ratingText">5 Stars - Excellent</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Comments & Suggestions</label>
              <textarea class="form-control" id="feedbackComment" rows="3" placeholder="Tell us about the food quality, taste, service speed..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-accent btn-sm" id="submitFeedbackBtn">Submit Feedback</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let feedbackModal = null;
    let selectedRating = 5;

    document.addEventListener('DOMContentLoaded', async () => {
      feedbackModal = new bootstrap.Modal(document.getElementById('feedbackModal'));
      
      const role = getUserRole();
      if (role === 'admin' || role === 'manager') {
        document.getElementById('branchFilterCol').style.display = 'block';
        await loadBranches();
      }

      await loadOrders();
    });

    async function loadBranches() {
      try {
        const res = await api.getBranches('?limit=50&active=true');
        const select = document.getElementById('branchFilter');
        res.data.branches.forEach(b => {
          select.innerHTML += `<option value="${b._id}">${b.name}</option>`;
        });
      } catch (err) {}
    }

    async function loadOrders() {
      const grid = document.getElementById('ordersGrid');
      
      if (!isLoggedIn()) {
        grid.innerHTML = `
          <div class="col-12 empty-state">
            <i class="bi bi-lock"></i>
            <h6>Please Log In</h6>
            <p class="text-muted small">Sign in to view your order history and track live status.</p>
            <a href="login.html" class="btn btn-accent btn-sm">Login Now</a>
          </div>
        `;
        return;
      }

      let query = '?limit=50';
      const status = document.getElementById('statusFilter').value;
      const type = document.getElementById('typeFilter').value;
      const branchId = document.getElementById('branchFilter')?.value;

      if (status) query += `&status=${status}`;
      if (type) query += `&orderType=${type}`;
      if (branchId) query += `&branchId=${branchId}`;

      try {
        const res = await api.getOrders(query);
        const orders = res.data.orders;

        if (orders.length === 0) {
          grid.innerHTML = `
            <div class="col-12 empty-state">
              <i class="bi bi-receipt"></i>
              <h5>No Orders Found</h5>
              <p class="text-muted small">You don't have any orders matching the filter.</p>
              <a href="menu.html" class="btn btn-accent btn-sm mt-2">Explore Menu & Order</a>
            </div>
          `;
          return;
        }

        const role = getUserRole();
        const isAdmin = role === 'admin' || role === 'manager';

        grid.innerHTML = orders.map(order => {
          const isPlaced = order.status === 'placed';
          const isCompleted = ['served', 'delivered'].includes(order.status);
          const isCancelled = order.status === 'cancelled';

          return `
            <div class="col-lg-6">
              <div class="data-card h-100 d-flex flex-column justify-content-between">
                <div>
                  <div class="d-flex justify-content-between align-items-start mb-3 border-bottom pb-2" style="border-color:var(--glass-border) !important">
                    <div>
                      <h6 class="fw-bold mb-0 text-white">${order.orderNumber}</h6>
                      <div class="text-muted small mt-1">
                        <i class="bi bi-geo-alt me-1 text-accent"></i>${order.branchId?.name || 'Branch'} 
                        <span class="mx-1">•</span> 
                        <span class="badge bg-secondary-subtle text-light">${order.orderType === 'dine_in' ? 'Dine-In' : 'Takeaway'}</span>
                      </div>
                    </div>
                    <div class="text-end">
                      ${statusBadge(order.status)}
                      <div class="text-muted small mt-1">${formatDateTime(order.createdAt)}</div>
                    </div>
                  </div>

                  ${isAdmin ? `
                    <div class="small text-muted mb-2"><i class="bi bi-person me-1"></i>Customer: ${escapeHtml(order.customerId?.name || 'Guest')} (${order.customerId?.email || ''})</div>
                  ` : ''}

                  <!-- Items Table -->
                  <div class="table-responsive mb-3">
                    <table class="table table-sm table-dark table-dark-custom mb-0">
                      <thead>
                        <tr>
                          <th>Item</th>
                          <th class="text-center">Qty</th>
                          <th class="text-end">Price</th>
                          <th class="text-end">Total</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${order.items.map(it => `
                          <tr>
                            <td>${escapeHtml(it.name)}</td>
                            <td class="text-center">${it.quantity}</td>
                            <td class="text-end">${formatCurrency(it.price)}</td>
                            <td class="text-end">${formatCurrency(it.itemTotal)}</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>

                  <!-- Billing Summary -->
                  <div class="glass-card-inner p-2 mb-3 small">
                    <div class="d-flex justify-content-between text-muted">
                      <span>Subtotal</span>
                      <span>${formatCurrency(order.billing?.subtotal || order.totalAmount)}</span>
                    </div>
                    <div class="d-flex justify-content-between text-muted">
                      <span>Tax (5%)</span>
                      <span>${formatCurrency(order.billing?.tax || 0)}</span>
                    </div>
                    <div class="d-flex justify-content-between text-muted">
                      <span>Service Charge (10%)</span>
                      <span>${formatCurrency(order.billing?.serviceCharge || 0)}</span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold text-white border-top pt-1 mt-1" style="border-color:var(--glass-border) !important">
                      <span>Grand Total</span>
                      <span class="text-accent">${formatCurrency(order.billing?.grandTotal || order.totalAmount)}</span>
                    </div>
                  </div>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-between align-items-center pt-2 border-top" style="border-color:var(--glass-border) !important">
                  <div>
                    ${isCompleted && !isAdmin ? `
                      <button class="btn btn-outline-warning btn-sm" onclick="openFeedbackModal('${order._id}')">
                        <i class="bi bi-star me-1"></i>Give Feedback
                      </button>
                    ` : ''}
                  </div>
                  <div class="d-flex gap-2">
                    ${isPlaced ? `
                      <button class="btn btn-outline-danger btn-sm" onclick="cancelOrder('${order._id}')">
                        <i class="bi bi-x-circle me-1"></i>Cancel Order
                      </button>
                    ` : ''}
                    ${isAdmin && !isCancelled && !isCompleted ? `
                      <div class="dropdown">
                        <button class="btn btn-sm btn-accent dropdown-toggle" data-bs-toggle="dropdown">
                          Update Status
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                          ${order.status === 'placed' ? `<li><a class="dropdown-item" href="#" onclick="updateStatus('${order._id}','preparing')">Mark Preparing</a></li>` : ''}
                          ${order.status === 'preparing' ? `<li><a class="dropdown-item" href="#" onclick="updateStatus('${order._id}','ready')">Mark Ready</a></li>` : ''}
                          ${order.status === 'ready' ? `
                            <li><a class="dropdown-item" href="#" onclick="updateStatus('${order._id}','served')">Mark Served</a></li>
                            <li><a class="dropdown-item" href="#" onclick="updateStatus('${order._id}','delivered')">Mark Delivered</a></li>
                          ` : ''}
                        </ul>
                      </div>
                    ` : ''}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5 text-danger">
            <i class="bi bi-exclamation-triangle fs-2 mb-2"></i>
            <p>Failed to load orders: ${err.message || 'Server error'}</p>
          </div>
        `;
      }
    }

    async function cancelOrder(id) {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      try {
        await api.updateOrderStatus(id, 'cancelled');
        showToast('Order cancelled successfully', 'success');
        loadOrders();
      } catch (err) {
        showToast(err.message || 'Failed to cancel order', 'error');
      }
    }

    async function updateStatus(id, newStatus) {
      try {
        await api.updateOrderStatus(id, newStatus);
        showToast(`Order status updated to ${newStatus}`, 'success');
        loadOrders();
      } catch (err) {
        showToast(err.message || 'Failed to update order status', 'error');
      }
    }

    // Feedback Logic
    function openFeedbackModal(orderId) {
      document.getElementById('feedbackOrderId').value = orderId;
      document.getElementById('feedbackComment').value = '';
      setRating(5);
      feedbackModal.show();
    }

    function setRating(rating) {
      selectedRating = rating;
      document.getElementById('feedbackRating').value = rating;
      const stars = document.querySelectorAll('#starContainer i');
      stars.forEach((s, idx) => {
        if (idx < rating) {
          s.className = 'bi bi-star-fill active';
        } else {
          s.className = 'bi bi-star';
        }
      });

      const labels = ['', '1 Star - Poor', '2 Stars - Fair', '3 Stars - Good', '4 Stars - Very Good', '5 Stars - Excellent'];
      document.getElementById('ratingText').textContent = labels[rating] || '';
    }

    async function submitFeedback(e) {
      e.preventDefault();
      const orderId = document.getElementById('feedbackOrderId').value;
      const rating = parseInt(document.getElementById('feedbackRating').value);
      const comment = document.getElementById('feedbackComment').value.trim();

      const btn = document.getElementById('submitFeedbackBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

      try {
        await api.createFeedback({ orderId, rating, comment });
        showToast('Thank you for your valuable feedback!', 'success');
        feedbackModal.hide();
        loadOrders();
      } catch (err) {
        showToast(err.message || 'Failed to submit feedback', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Submit Feedback';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>

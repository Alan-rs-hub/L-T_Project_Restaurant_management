<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kitchen Display System for Live Order Tracking">
  <title>Kitchen Display — DineFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .kds-column-header {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kds-item-qty {
      min-width: 28px;
      height: 28px;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-egg-fried me-2"></i>DineFlow <span class="badge bg-warning text-dark ms-2 font-monospace">KDS</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        <div id="userMenu" class="ms-3 d-none">
          <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" id="userDropdown">
              <i class="bi bi-person-circle me-1"></i><span id="userName">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
              <li><span class="dropdown-item-text text-muted small" id="userRole">Role</span></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- KDS Header & Controls -->
  <section class="page-header pb-3">
    <div class="container-fluid px-4">
      <div class="row align-items-center g-3">
        <div class="col-md-6">
          <h2 class="fw-bold mb-1"><i class="bi bi-fire text-warning me-2"></i>Kitchen Queue</h2>
          <p class="text-muted mb-0">Live order management & workflow state transitions</p>
        </div>
        <div class="col-md-6 d-flex justify-content-md-end align-items-center gap-3 flex-wrap">
          <div>
            <select class="form-select form-select-sm" id="branchFilter" onchange="loadKitchenQueue()">
              <option value="">All Branches</option>
            </select>
          </div>
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="autoRefreshSwitch" checked onchange="toggleAutoRefresh()">
            <label class="form-check-label small text-muted" for="autoRefreshSwitch">Auto-Refresh (<span id="countdown">10</span>s)</label>
          </div>
          <button class="btn btn-outline-light btn-sm" onclick="loadKitchenQueue()">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- KDS 3-Column Board -->
  <section class="py-4">
    <div class="container-fluid px-4">
      <div class="row g-4">
        <!-- Placed / New Orders Column -->
        <div class="col-lg-4">
          <div class="kds-column-header bg-info bg-opacity-25 text-info border border-info border-opacity-50">
            <span><i class="bi bi-bell-fill me-2"></i>1. Placed / New</span>
            <span class="badge bg-info text-dark" id="countPlaced">0</span>
          </div>
          <div id="placedColumn" class="d-flex flex-column gap-3">
            <div class="text-center py-4 text-muted small">No new orders</div>
          </div>
        </div>

        <!-- Preparing Orders Column -->
        <div class="col-lg-4">
          <div class="kds-column-header bg-warning bg-opacity-25 text-warning border border-warning border-opacity-50">
            <span><i class="bi bi-fire me-2"></i>2. Cooking / Preparing</span>
            <span class="badge bg-warning text-dark" id="countPreparing">0</span>
          </div>
          <div id="preparingColumn" class="d-flex flex-column gap-3">
            <div class="text-center py-4 text-muted small">No orders currently cooking</div>
          </div>
        </div>

        <!-- Ready Orders Column -->
        <div class="col-lg-4">
          <div class="kds-column-header bg-success bg-opacity-25 text-success border border-success border-opacity-50">
            <span><i class="bi bi-check-circle-fill me-2"></i>3. Ready for Service</span>
            <span class="badge bg-success" id="countReady">0</span>
          </div>
          <div id="readyColumn" class="d-flex flex-column gap-3">
            <div class="text-center py-4 text-muted small">No orders ready</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let refreshInterval = null;
    let countdownInterval = null;
    let countdownSec = 10;
    let knownOrderIds = new Set();

    document.addEventListener('DOMContentLoaded', async () => {
      // Guard route: Only kitchen, admin, manager
      if (!requireAuth(['kitchen', 'admin', 'manager'])) return;

      await loadBranches();
      await loadKitchenQueue();
      startAutoRefresh();
    });

    async function loadBranches() {
      try {
        const res = await api.getBranches('?limit=50&active=true');
        const select = document.getElementById('branchFilter');
        res.data.branches.forEach(b => {
          select.innerHTML += `<option value="${b._id}">${b.name}</option>`;
        });
      } catch (err) {}
    }

    function toggleAutoRefresh() {
      const enabled = document.getElementById('autoRefreshSwitch').checked;
      if (enabled) {
        startAutoRefresh();
      } else {
        clearInterval(refreshInterval);
        clearInterval(countdownInterval);
        document.getElementById('countdown').textContent = '--';
      }
    }

    function startAutoRefresh() {
      clearInterval(refreshInterval);
      clearInterval(countdownInterval);
      countdownSec = 10;
      document.getElementById('countdown').textContent = countdownSec;

      countdownInterval = setInterval(() => {
        countdownSec--;
        if (countdownSec <= 0) countdownSec = 10;
        document.getElementById('countdown').textContent = countdownSec;
      }, 1000);

      refreshInterval = setInterval(() => {
        loadKitchenQueue();
      }, 10000);
    }

    async function loadKitchenQueue() {
      const branchId = document.getElementById('branchFilter').value;
      let query = '';
      if (branchId) query = `?branchId=${branchId}`;

      try {
        const res = await api.getKitchenOrders(query);
        const orders = res.data.orders;

        const placedCol = document.getElementById('placedColumn');
        const preparingCol = document.getElementById('preparingColumn');
        const readyCol = document.getElementById('readyColumn');

        const placedOrders = orders.filter(o => o.status === 'placed');
        const preparingOrders = orders.filter(o => o.status === 'preparing');
        const readyOrders = orders.filter(o => o.status === 'ready');

        document.getElementById('countPlaced').textContent = placedOrders.length;
        document.getElementById('countPreparing').textContent = preparingOrders.length;
        document.getElementById('countReady').textContent = readyOrders.length;

        // Check for new orders to play chime
        let hasNew = false;
        placedOrders.forEach(o => {
          if (!knownOrderIds.has(o._id)) {
            hasNew = true;
            knownOrderIds.add(o._id);
          }
        });
        if (hasNew && knownOrderIds.size > placedOrders.length) {
          playChime();
        }

        placedCol.innerHTML = placedOrders.length === 0 ? '<div class="text-center py-4 text-muted small">No new orders</div>' : placedOrders.map(renderOrderCard).join('');
        preparingCol.innerHTML = preparingOrders.length === 0 ? '<div class="text-center py-4 text-muted small">No orders currently cooking</div>' : preparingOrders.map(renderOrderCard).join('');
        readyCol.innerHTML = readyOrders.length === 0 ? '<div class="text-center py-4 text-muted small">No orders ready</div>' : readyOrders.map(renderOrderCard).join('');

      } catch (err) {
        console.error('KDS load error:', err);
      }
    }

    function renderOrderCard(order) {
      const elapsedMins = Math.floor((new Date() - new Date(order.createdAt)) / (1000 * 60));
      const typeBadge = order.orderType === 'dine_in' 
        ? `<span class="badge bg-primary-subtle text-primary">Dine-in ${order.tableId ? '(Table)' : ''}</span>`
        : `<span class="badge bg-warning-subtle text-warning">Takeaway</span>`;

      let actionButton = '';
      if (order.status === 'placed') {
        actionButton = `
          <button class="btn btn-warning w-100 py-2 fw-bold text-dark" onclick="updateOrderStatus('${order._id}','preparing')">
            <i class="bi bi-fire me-2"></i>Start Cooking
          </button>
        `;
      } else if (order.status === 'preparing') {
        actionButton = `
          <button class="btn btn-success w-100 py-2 fw-bold" onclick="updateOrderStatus('${order._id}','ready')">
            <i class="bi bi-check-lg me-2"></i>Mark as Ready
          </button>
        `;
      } else if (order.status === 'ready') {
        const nextStatus = order.orderType === 'dine_in' ? 'served' : 'delivered';
        const label = order.orderType === 'dine_in' ? 'Mark Served' : 'Mark Delivered';
        actionButton = `
          <button class="btn btn-accent w-100 py-2 fw-bold" onclick="updateOrderStatus('${order._id}','${nextStatus}')">
            <i class="bi bi-box-arrow-right me-2"></i>${label}
          </button>
        `;
      }

      return `
        <div class="kitchen-order-card status-${order.status}">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <div class="fw-bold fs-6 text-white">${order.orderNumber}</div>
              <div class="text-muted small">${order.branchId?.name || 'Branch'} • ${typeBadge}</div>
            </div>
            <span class="badge bg-dark border border-secondary text-muted small">
              <i class="bi bi-clock me-1"></i>${elapsedMins}m ago
            </span>
          </div>

          <div class="py-2 border-top border-bottom my-2" style="border-color:var(--glass-border) !important">
            ${order.items.map(it => `
              <div class="d-flex align-items-center mb-1">
                <span class="kds-item-qty">${it.quantity}</span>
                <span class="text-white fw-500">${escapeHtml(it.name)}</span>
              </div>
            `).join('')}
          </div>

          <div class="pt-2">
            ${actionButton}
          </div>
        </div>
      `;
    }

    async function updateOrderStatus(id, newStatus) {
      try {
        await api.updateOrderStatus(id, newStatus);
        showToast(`Order updated to ${newStatus}`, 'success');
        await loadKitchenQueue();
      } catch (err) {
        showToast(err.message || 'Status transition failed', 'error');
      }
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
